    <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>บันทึกสุขภาพ - อสม.สามารถ</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f9ff; -webkit-tap-highlight-color: transparent;}
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .loader-small { border: 3px solid #f3f3f3; border-bottom-color: #0284c7; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <header class="bg-[#0284c7] sticky top-0 z-50 shadow-md flex justify-between items-center w-full px-4 h-16 text-white">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition-colors active:scale-95">
                <span class="material-symbols-outlined text-[24px]">arrow_back</span>
            </button>
            <div>
                <h1 class="text-lg font-bold leading-tight">บันทึกข้อมูลสุขภาพ</h1>
                <p class="text-[11px] text-sky-100 font-medium">ความดันโลหิต และ น้ำตาลในเลือด</p>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-5">
        
        <div class="bg-white rounded-[20px] p-5 shadow-sm border border-slate-200 flex items-center gap-4 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-24 h-24 bg-sky-50 rounded-bl-full -z-10"></div>
            <div class="w-14 h-14 rounded-full bg-slate-100 text-slate-400 border-2 border-white shadow-sm flex items-center justify-center font-bold text-xl flex-shrink-0" id="patient-initial">?</div>
            <div class="flex-1 min-w-0">
                <h2 class="text-lg font-bold text-slate-800 truncate" id="patient-name">กำลังโหลด...</h2>
                <p class="text-xs text-slate-500 truncate mt-0.5">หมู่ที่ <span id="patient-village">-</span> • อายุ <span id="patient-age">-</span> ปี</p>
            </div>
        </div>

        <div class="bg-white rounded-[20px] p-5 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><span class="material-symbols-outlined text-sky-500 text-[20px]">calendar_today</span> วันที่ตรวจวัด</h3>
                <input type="date" id="assess-date" class="px-3 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <!-- ความดันโลหิต -->
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center"><span class="material-symbols-outlined text-[18px]">favorite</span></div>
                    <h3 class="font-bold text-slate-700">ความดันโลหิต (Blood Pressure)</h3>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">ตัวบน (SYS) <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="number" id="vital-sys" class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 focus:ring-2 focus:ring-red-500 outline-none" placeholder="120">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">mmHg</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">ตัวล่าง (DIA) <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="number" id="vital-dia" class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 focus:ring-2 focus:ring-red-500 outline-none" placeholder="80">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">mmHg</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">ชีพจร / อัตราการเต้นหัวใจ (HR)</label>
                    <div class="relative">
                        <input type="number" id="vital-hr" class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="75">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">bpm</span>
                    </div>
                </div>
            </div>

            <hr class="border-slate-100 my-5">

            <!-- น้ำตาลในเลือด -->
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><span class="material-symbols-outlined text-[18px]">water_drop</span></div>
                    <h3 class="font-bold text-slate-700">น้ำตาลในเลือด (Blood Sugar)</h3>
                </div>

                <div class="mb-4">
                    <label class="text-xs font-bold text-slate-500 mb-1 block">ระดับน้ำตาล (DTX)</label>
                    <div class="relative">
                        <input type="number" id="vital-sugar" class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="90">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">mg/dL</span>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 mb-2 block">สถานะการตรวจ</label>
                    <div class="flex gap-4">
                        <label class="flex-1 relative cursor-pointer">
                            <input type="radio" name="meal_status" value="ก่อนอาหาร" class="peer sr-only" checked>
                            <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 font-bold text-sm transition-all text-slate-500">
                                อดอาหาร (ก่อน)
                            </div>
                        </label>
                        <label class="flex-1 relative cursor-pointer">
                            <input type="radio" name="meal_status" value="หลังอาหาร" class="peer sr-only">
                            <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-orange-50 peer-checked:border-orange-500 peer-checked:text-orange-700 font-bold text-sm transition-all text-slate-500">
                                ไม่ได้อด (หลัง)
                            </div>
                        </label>
                    </div>
                </div>
            </div>

        </div>

        <button onclick="saveVitals()" id="btn-save" class="w-full bg-[#0284c7] text-white py-4 rounded-xl font-bold shadow-lg hover:bg-[#0369a1] active:scale-95 transition-all flex items-center justify-center gap-2 text-lg">
            <span class="material-symbols-outlined">save</span> บันทึกข้อมูลสุขภาพ
        </button>

    </main>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        let currentPatientData = null;

        // 🌟 ตัวแปรเก็บข้อมูลผู้ประเมิน 🌟
        let currentUserUid = "";
        let currentUserName = "เจ้าหน้าที่";

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('assess-date').valueAsDate = new Date();

            liff.init({ liffId: LIFF_ID }).then(() => {
                const mockUid = localStorage.getItem('dev_mock_uid');
                const savedUid = localStorage.getItem('orsomo_uid');
                if (mockUid) {
                    verifyUserAccess(mockUid);
                } else if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        localStorage.setItem('orsomo_uid', profile.userId);
                        verifyUserAccess(profile.userId);
                    }).catch(err => console.error(err));
                } else if (savedUid) {
                    verifyUserAccess(savedUid);
                } else { window.location.href = 'index.html'; }
            }).catch(() => { window.location.href = 'index.html'; });

            loadPatientData();
        });

        // 🌟 ดึงข้อมูลผู้ประเมินจาก Firebase VHVs 🌟
        async function verifyUserAccess(uid) {
            currentUserUid = uid;
            try {
                const userDoc = await db.collection('VHVs').doc(String(uid)).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    if(data.name) currentUserName = data.name;
                }
            } catch(e) { console.error(e); }
        }

        async function loadPatientData() {
            if (!patientId) { goBack(); return; }
            try {
                const docRef = db.collection('Patients').doc(String(patientId));
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    currentPatientData = docSnap.data();
                    document.getElementById('patient-name').innerText = (currentPatientData.prefix || '') + (currentPatientData.name || '');
                    document.getElementById('patient-village').innerText = currentPatientData.village_no || '-';
                    document.getElementById('patient-age').innerText = currentPatientData.age || '-';
                    document.getElementById('patient-initial').innerText = currentPatientData.name ? currentPatientData.name.substring(0, 1) : '?';
                }
            } catch (error) { console.error(error); }
        }

        async function saveVitals() {
            const sysVal = document.getElementById('vital-sys').value;
            const diaVal = document.getElementById('vital-dia').value;
            const hrVal = document.getElementById('vital-hr').value;
            const sugarVal = document.getElementById('vital-sugar').value;

            // ตรวจสอบความถูกต้องเบื้องต้น (ถ้ากรอกความดัน ต้องกรอกทั้ง SYS และ DIA)
            if ((sysVal && !diaVal) || (!sysVal && diaVal)) {
                alert("กรุณากรอกข้อมูลความดันโลหิตให้ครบทั้งตัวบน (SYS) และตัวล่าง (DIA)");
                return;
            }

            // ถ้าไม่ได้กรอกอะไรเลย
            if (!sysVal && !diaVal && !sugarVal) {
                alert("กรุณากรอกข้อมูลความดันโลหิต หรือ ข้อมูลน้ำตาลในเลือด อย่างน้อย 1 รายการ");
                return;
            }

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader-small" style="border-width:2px; width:20px; height:20px; border-bottom-color:transparent;"></div> กำลังบันทึก...';

            const assessDate = document.getElementById('assess-date').value;
            const dateParts = assessDate.split('-');
            const thaiYear = parseInt(dateParts[0]) + 543;
            const formattedDate = `${dateParts[2]}/${dateParts[1]}/${thaiYear}`;

            // 🌟 1. สร้างก้อนข้อมูลสำหรับเก็บใน Collection Vitals 🌟
            const vitalsData = {
                patient_id: patientId,
                date: formattedDate,
                sys: sysVal,
                dia: diaVal,
                hr: hrVal,
                sugar: sugarVal,
                meal: sugarVal ? document.querySelector('input[name="meal_status"]:checked').value : '',
                assessor_uid: currentUserUid,      // เก็บ UID คนประเมิน
                assessor_name: currentUserName,    // เก็บชื่อคนประเมิน
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                const batch = db.batch();
                
                // เก็บลง Vitals
                const newVitalsRef = db.collection('Vitals').doc();
                batch.set(newVitalsRef, vitalsData);
                
                // อัปเดตลง Patients (last_assess)
                const patientRef = db.collection('Patients').doc(String(patientId));
                batch.update(patientRef, {
                    last_assess: formattedDate
                });

                await batch.commit();
                
                alert("บันทึกข้อมูลสุขภาพสำเร็จ!");
                window.location.href = `patient_profile.html?id=${patientId}`;

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่");
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">save</span> บันทึกข้อมูลสุขภาพ';
            }
        }

        function goBack() {
            if(patientId) window.location.href = `patient_profile.html?id=${patientId}`;
            else window.location.href = 'assessments.html';
        }
    </script>
</body>
</html>
