<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>ประเมิน ADL</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="config.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f9f9ff; padding-bottom: 120px; -webkit-tap-highlight-color: transparent;}
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + label { background-color: #F59E0B; color: white; border-color: #F59E0B; font-weight: bold; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.2); }
        .loader-small { border: 2px solid #f3f3f3; border-bottom-color: transparent; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-[#111c2d]">

    <header class="bg-white sticky top-0 z-50 shadow-sm flex justify-between items-center w-full px-4 h-16 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-[#F59E0B] hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div>
                <h1 class="text-base font-bold text-[#F59E0B]">ประเมิน ADL</h1>
                <p class="text-xs text-gray-500" id="patient-id-display">รหัส: กำลังโหลด...</p>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4" id="adl-container">
        <!-- คำถาม ADL จะถูกสร้างด้วย JavaScript -->
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] p-4 flex justify-between items-center z-50">
        <div class="flex-1">
            <p class="text-[10px] text-gray-500 font-bold mb-0.5">รวมคะแนน ADL</p>
            <div class="flex items-center gap-2">
                <span id="total-score" class="text-2xl font-black text-[#F59E0B] leading-none">0</span>
                <span id="result-status" class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm">รอประเมิน</span>
            </div>
        </div>
        <button onclick="saveADL()" id="btn-save" class="bg-[#F59E0B] text-white px-6 py-3.5 rounded-xl font-bold shadow-md hover:bg-[#D97706] active:scale-95 transition-all flex items-center gap-2">
            บันทึกผล
            <span class="material-symbols-outlined text-sm">save</span>
        </button>
    </div>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        document.getElementById('patient-id-display').innerText = `รหัส: ${patientId || 'ไม่ระบุ'}`;

        let currentUserUid = "";
        let currentAssessorName = "เจ้าหน้าที่ระบบ"; // 🌟 ตัวแปรเก็บชื่อคนประเมิน

        document.addEventListener("DOMContentLoaded", () => {
            liff.init({ liffId: LIFF_ID }).then(() => {
                const mockUid = localStorage.getItem('dev_mock_uid');
                if (mockUid) {
                    currentUserUid = mockUid;
                    fetchAssessorData(mockUid);
                } else if (liff.isLoggedIn()) {
                    liff.getProfile().then(p => { 
                        currentUserUid = p.userId; 
                        fetchAssessorData(p.userId);
                    });
                } else { liff.login(); }
            });
        });

        // 🌟 ฟังก์ชันดึงชื่อ-นามสกุลจากฐานข้อมูล VHVs
        async function fetchAssessorData(uid) {
            try {
                const doc = await db.collection('VHVs').doc(String(uid)).get();
                if(doc.exists) {
                    currentAssessorName = doc.data().name || "เจ้าหน้าที่";
                }
            } catch(e) { console.error("ดึงข้อมูลผู้ประเมินไม่ได้", e); }
        }

        const questionsADL = [
            { id: 'adl_1', text: "1. การรับประทานอาหารเมื่อเตรียมสำรับไว้ให้เรียบร้อยต่อหน้า", choices: [
                { score: 0, text: "ตักกินเองไม่ได้ (มีคนป้อน)" },
                { score: 1, text: "ตักกินเองได้บ้าง (มีคนช่วยเตรียม)" },
                { score: 2, text: "ตักกินเองได้เป็นปกติ" }
            ]},
            { id: 'adl_2', text: "2. การล้างหน้า หวีผม แปรงฟัน โกนหนวด", choices: [
                { score: 0, text: "ต้องการความช่วยเหลือ" },
                { score: 1, text: "ทำเองได้" }
            ]},
            { id: 'adl_3', text: "3. การลุกนั่งจากที่นอน หรือเตียงไปยังเก้าอี้", choices: [
                { score: 0, text: "นั่งไม่ได้ / ใช้คนยก 2 คน" },
                { score: 1, text: "ต้องการคนพยุงอย่างมาก" },
                { score: 2, text: "ต้องการคนพยุงเล็กน้อย" },
                { score: 3, text: "ทำได้เอง" }
            ]},
            { id: 'adl_4', text: "4. การใช้ห้องน้ำ", choices: [
                { score: 0, text: "ช่วยตัวเองไม่ได้" },
                { score: 1, text: "ทำเองได้บ้าง (มีคนช่วยบางส่วน)" },
                { score: 2, text: "ทำได้เองเรียบร้อยดี" }
            ]},
            { id: 'adl_5', text: "5. การเคลื่อนที่ภายในห้องหรือบ้าน", choices: [
                { score: 0, text: "เคลื่อนที่ไม่ได้" },
                { score: 1, text: "ใช้รถเข็นช่วยตัวเองได้" },
                { score: 2, text: "เดินโดยมีคนช่วยพยุง" },
                { score: 3, text: "เดินได้เอง" }
            ]},
            { id: 'adl_6', text: "6. การสวมใส่เสื้อผ้า", choices: [
                { score: 0, text: "ต้องมีคนสวมให้ทั้งหมด" },
                { score: 1, text: "ช่วยตัวเองได้ประมาณ 50%" },
                { score: 2, text: "สวมใส่เองได้ดี" }
            ]},
            { id: 'adl_7', text: "7. การขึ้นลงบันได 1 ชั้น", choices: [
                { score: 0, text: "ทำไม่ได้" },
                { score: 1, text: "ต้องการคนช่วย" },
                { score: 2, text: "ทำได้เอง" }
            ]},
            { id: 'adl_8', text: "8. การอาบน้ำ", choices: [
                { score: 0, text: "ต้องมีคนช่วย" },
                { score: 1, text: "อาบเองได้" }
            ]},
            { id: 'adl_9', text: "9. การกลั้นการถ่ายอุจจาระ", choices: [
                { score: 0, text: "กลั้นไม่ได้เลย" },
                { score: 1, text: "กลั้นไม่ได้บางครั้ง" },
                { score: 2, text: "กลั้นได้ปกติ" }
            ]},
            { id: 'adl_10', text: "10. การกลั้นการถ่ายปัสสาวะ", choices: [
                { score: 0, text: "กลั้นไม่ได้ / ใส่สายสวน" },
                { score: 1, text: "กลั้นไม่ได้บางครั้ง" },
                { score: 2, text: "กลั้นได้ปกติ" }
            ]}
        ];

        function renderADL() {
            const container = document.getElementById('adl-container');
            questionsADL.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.choices.forEach((opt, idx) => {
                    optionsHtml += `
                        <div class="col-span-1">
                            <input type="radio" id="${q.id}_${idx}" name="${q.id}" value="${opt.score}" onchange="calculateScore()">
                            <label for="${q.id}_${idx}" class="block p-3 text-xs bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-[#F59E0B] transition-all h-full flex flex-col justify-center">
                                <span class="font-bold text-[#F59E0B] mb-1 text-center w-full block">ได้ ${opt.score} คะแนน</span>
                                <span class="text-gray-600 text-center leading-tight">${opt.text}</span>
                            </label>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-[#111c2d] mb-3 text-sm">${q.text}</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function calculateScore() {
            let total = 0;
            let answered = 0;
            
            questionsADL.forEach(q => {
                const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if (selected) {
                    total += parseInt(selected.value);
                    answered++;
                }
            });

            document.getElementById('total-score').innerText = total;
            const badge = document.getElementById('result-status');
            
            if (answered < 10) {
                badge.innerText = `ตอบแล้ว ${answered}/10`;
                badge.className = 'bg-gray-200 text-gray-700 px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm ml-2';
                return;
            }

            if (total >= 12) {
                badge.innerText = 'กลุ่มติดสังคม';
                badge.className = 'bg-[#00694a] text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm ml-2';
            } else if (total >= 5) {
                badge.innerText = 'กลุ่มติดบ้าน';
                badge.className = 'bg-[#F59E0B] text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm ml-2';
            } else {
                badge.innerText = 'กลุ่มติดเตียง';
                badge.className = 'bg-[#ba1a1a] text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm ml-2';
            }
        }

        async function saveADL() {
            if (!patientId) return alert("ไม่พบข้อมูลผู้ป่วย กรุณากลับไปหน้ารายชื่อ");

            let answered = 0;
            let answersDetail = []; 
            let totalScore = 0; 

            questionsADL.forEach(q => { 
                const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if(selected) {
                    answered++;
                    const scoreVal = parseInt(selected.value);
                    totalScore += scoreVal;
                    const optObj = q.choices.find(o => o.score === scoreVal);
                    answersDetail.push({ q: q.text, a: optObj ? optObj.text : String(scoreVal), score: scoreVal });
                }
            });

            if (answered < 10) return alert(`กรุณาตอบคำถามให้ครบทุกข้อ (ตอบแล้ว ${answered}/10 ข้อ)`);

            const status = document.getElementById('result-status').innerText;
            
            const btn = document.getElementById('btn-save');
            btn.innerHTML = '<div class="loader-small mr-2"></div> กำลังบันทึก...';
            btn.disabled = true;

            try {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear() + 543;
                const formattedDate = `${dd}/${mm}/${yyyy}`;

                // 1. อัปเดตโปรไฟล์คนไข้
                await db.collection('Patients').doc(String(patientId)).update({
                    adl: String(totalScore),
                    group: status,
                    last_assess: formattedDate
                });

                // 2. บันทึกประวัติพร้อมคำตอบละเอียด
                await db.collection('Assessments').add({
                    patient_id: String(patientId),
                    type: 'ADL',
                    score1: totalScore, 
                    result: status,
                    answers: answersDetail,
                    assessor_uid: currentUserUid, 
                    assessor_name: currentAssessorName, // 🌟 เพิ่มตรงนี้
                    date: formattedDate,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('บันทึกผลประเมิน ADL สำเร็จ!');
                window.location.href = `patient_profile.html?id=${patientId}`;

            } catch (err) {
                console.error(err);
                alert('การเชื่อมต่อฐานข้อมูลล้มเหลว กรุณาลองอีกครั้ง');
                btn.innerHTML = 'บันทึกผล <span class="material-symbols-outlined text-sm">save</span>'; 
                btn.disabled = false;
            }
        }

        renderADL();
    </script>
</body>
</html>
