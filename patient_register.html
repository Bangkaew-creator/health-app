<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>ลงทะเบียนผู้ป่วยใหม่ - อสม.สามารถ (Orsomo Smart)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="core.js?v=20261109_auth"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; padding-bottom: 110px; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .loader-small { border: 2px solid #d8e3fb; border-bottom-color: #00694a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .input-field { width: 100%; border: 1px solid #e2e8f0; border-radius: 14px; padding: 13px 14px; font-size: 15px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .input-field:focus { border-color: #00694a; box-shadow: 0 0 0 3px rgba(0,105,74,0.1); }
    </style>
</head>
<body class="text-[#111c2d]">

<header class="bg-white sticky top-0 z-50 shadow-sm flex items-center justify-between w-full px-4 h-16 border-b border-gray-200 gap-3">
    <div class="flex items-center gap-3">
        <button type="button" onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-[#00694a] hover:bg-gray-100 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <div>
            <h1 class="text-base font-bold text-[#00694a] leading-tight">ลงทะเบียนผู้ป่วยใหม่</h1>
            <p id="header-vhv-name" class="text-[11px] text-gray-500 font-medium">ตรวจสอบสิทธิ์ผู้ใช้งาน...</p>
        </div>
    </div>
</header>

<main class="max-w-2xl mx-auto p-4 pt-5 space-y-5">

    <div id="loading-overlay" class="bg-[#f0fdf4] border border-[#bbf7d0] p-3.5 rounded-xl flex items-center justify-center gap-2 text-[#15803d] text-sm font-bold">
        <div class="loader-small" style="width:16px; height:16px; border-width:2px; border-bottom-color:#15803d;"></div> กำลังเตรียมแบบฟอร์มลงทะเบียน...
    </div>

    <form id="patient-form" class="space-y-5 hidden">
        
        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#00694a] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">person</span> ข้อมูลส่วนบุคคล
            </h3>
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]" for="id_card">เลขประจำตัวประชาชน (13 หลัก) <span class="text-[#ba1a1a]">*</span></label>
                <input type="tel" id="id_card" maxlength="13" required class="input-field font-mono tracking-wide" placeholder="กรอกเลขบัตรประชาชน 13 หลัก">
                <div id="id_card_check_status" class="hidden text-xs mt-1 transition-all"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="space-y-1.5 col-span-1">
                    <label class="text-xs font-bold text-[#526069]" for="prefix">คำนำหน้า</label>
                    <select id="prefix" class="input-field bg-white">
                        <option value="นาย">นาย</option>
                        <option value="นาง">นาง</option>
                        <option value="นางสาว">นางสาว</option>
                        <option value="ด.ช.">ด.ช.</option>
                        <option value="ด.ญ.">ด.ญ.</option>
                    </select>
                </div>
                <div class="space-y-1.5 col-span-2">
                    <label class="text-xs font-bold text-[#526069]" for="fullname">ชื่อ - นามสกุล <span class="text-[#ba1a1a]">*</span></label>
                    <input type="text" id="fullname" required maxlength="250" class="input-field" placeholder="เช่น สมชาย ใจดี">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]" for="dob">วันเดือนปีเกิด</label>
                    <input type="date" id="dob" class="input-field bg-white">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]" for="age">อายุปัจจุบัน (ปี)</label>
                    <input type="text" id="age" readonly class="input-field bg-gray-50 text-[#00694a] font-bold cursor-not-allowed" placeholder="คำนวณอัตโนมัติ">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#00694a] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">home</span> ที่อยู่ปัจจุบัน
            </h3>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]" for="house_no">บ้านเลขที่ <span class="text-[#ba1a1a]">*</span></label>
                    <input type="text" id="house_no" required maxlength="80" class="input-field" placeholder="เช่น 45/1">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]" for="village_no">หมู่ที่ <span class="text-[#ba1a1a]">*</span></label>
                    <select id="village_no" required class="input-field bg-white">
                        <option value="" disabled selected>เลือกหมู่ที่...</option>
                    </select>
                </div>
            </div>
            
            <div class="pt-2">
                <input type="hidden" id="lat_long_value" value="">
                <button type="button" id="btn-gps" class="w-full py-3.5 border-2 border-[#bdcac1] text-[#526069] rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-[#d8e3fb] transition-colors">
                    <span class="material-symbols-outlined text-[18px]">pin_drop</span> ปักหมุดพิกัด GPS บ้านผู้ป่วย
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#f59e0b] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">group</span> ญาติ / ผู้ดูแลใกล้ชิด
            </h3>
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]" for="caregiver_name">ชื่อ - นามสกุล ผู้ดูแล</label>
                <input type="text" id="caregiver_name" maxlength="250" class="input-field" placeholder="ระบุชื่อผู้ติดต่อหลัก (ถ้ามี)">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]" for="caregiver_phone">เบอร์โทรศัพท์ติดต่อ</label>
                <input type="tel" id="caregiver_phone" maxlength="50" class="input-field" placeholder="เช่น 0812345678">
            </div>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t p-4 z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.04)]">
            <button type="submit" id="btn-save" class="w-full max-w-2xl mx-auto bg-[#00694a] text-white py-4 rounded-xl font-bold shadow-md hover:bg-[#005239] active:scale-95 transition-all flex items-center justify-center gap-2 text-base">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                บันทึกข้อมูลและเปิดแฟ้มผู้ป่วย
            </button>
        </div>
    </form>
</main>

<script>
    let authCtx = null;
    let db = null;
    let isDuplicateBlocked = false;
    let checkTimeout = null;

    function escapeHtml(str) {
        return String(str === undefined || str === null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', async function () {
        try {
            authCtx = await OrsomoCore.Auth.guardPage({
                allowedRoles: ['VHV', 'SUB_ADMIN', 'ADMIN'],
                loginUrl: 'index.html'
            });
            db = authCtx.db;
            populateVillageSelect();
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('patient-form').classList.remove('hidden');
        } catch (err) {
            console.warn('Register access blocked:', err && err.message ? err.message : err);
        }
    });

    function populateVillageSelect() {
        const select = document.getElementById('village_no');
        const vCount = (authCtx.sysConfigs && authCtx.sysConfigs.VILLAGE_COUNT) || DEFAULT_CONFIGS.VILLAGE_COUNT;
        select.innerHTML = '<option value="" disabled selected>เลือกหมู่ที่...</option>';

        if (authCtx.role === 'SUB_ADMIN' && authCtx.assignedVillages.length > 0) {
            authCtx.assignedVillages.forEach(function (v) {
                select.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">หมู่ที่ ${escapeHtml(v)}</option>`);
            });
            if (authCtx.assignedVillages.length === 1) {
                select.value = authCtx.assignedVillages[0];
            }
        } else {
            for (let i = 1; i <= vCount; i++) {
                select.insertAdjacentHTML('beforeend', `<option value="${i}">หมู่ที่ ${i}</option>`);
            }
            if (authCtx.role === 'VHV' && authCtx.villageNo) {
                select.value = authCtx.villageNo;
                select.disabled = true;
                select.classList.add('bg-slate-100', 'text-slate-600', 'cursor-not-allowed');
            }
        }
    }

    function goBack() {
        if (authCtx && (authCtx.role === 'ADMIN' || authCtx.role === 'SUB_ADMIN')) {
            window.location.href = 'admin_datacenter.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    }

    document.getElementById('dob').addEventListener('change', function () {
        if (this.value) {
            const calc = OrsomoCore.DateUtils.calculateAge(this.value, '');
            document.getElementById('age').value = calc !== '-' ? calc : '';
        } else {
            document.getElementById('age').value = '';
        }
    });

    document.getElementById('btn-gps').addEventListener('click', function () {
        const btn = this;
        btn.innerHTML = `<div class="loader-small" style="border-bottom-color:#526069;"></div> กำลังค้นหาตำแหน่ง...`;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('lat_long_value').value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> พิกัด: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    btn.className = 'w-full py-3.5 border-2 border-[#00694a] text-[#00694a] bg-[#f0fdf4] rounded-xl text-xs font-bold flex items-center justify-center gap-2';
                },
                function () {
                    btn.innerHTML = `<span class="material-symbols-outlined">error</span> ไม่สามารถดึงตำแหน่งได้ โปรดเปิด GPS`;
                    btn.className = 'w-full py-3.5 border-2 border-[#dc2626] text-[#dc2626] rounded-xl text-xs font-bold flex items-center justify-center gap-2';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            showToast('อุปกรณ์ของคุณไม่รองรับการดึงพิกัด GPS', 'error');
        }
    });

    document.getElementById('id_card').addEventListener('input', function () {
        const val = this.value.replace(/\D/g, '').slice(0, 13);
        this.value = val;
        clearTimeout(checkTimeout);
        isDuplicateBlocked = false;

        const statusDiv = document.getElementById('id_card_check_status');
        if (!val) {
            statusDiv.classList.add('hidden');
            statusDiv.innerHTML = '';
            return;
        }

        if (val.length < 13) {
            statusDiv.className = 'text-xs mt-1.5 flex items-center gap-1 text-slate-500 font-medium';
            statusDiv.innerHTML = `กรอกแล้ว ${val.length}/13 หลัก`;
            statusDiv.classList.remove('hidden');
            return;
        }

        const idCheck = OrsomoCore.PatientValidator.validateThaiID(val);
        if (!idCheck.valid) {
            statusDiv.className = 'p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-xs mt-1.5 text-amber-800 font-bold flex items-center gap-1.5';
            statusDiv.innerHTML = `<span class="material-symbols-outlined text-[17px]">warning</span> ${escapeHtml(idCheck.message)}`;
            statusDiv.classList.remove('hidden');
            return;
        }

        statusDiv.className = 'text-xs mt-1.5 flex items-center gap-1.5 text-blue-600 font-medium';
        statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> กำลังตรวจสอบเลขบัตรประชาชนซ้ำในฐานข้อมูล...`;
        statusDiv.classList.remove('hidden');

        checkTimeout = setTimeout(function () {
            verifyDuplicateCID(val);
        }, 300);
    });

    async function verifyDuplicateCID(cleanCid) {
        const statusDiv = document.getElementById('id_card_check_status');
        try {
            const dupRes = await OrsomoCore.PatientValidator.checkDuplicateIDCard(db, cleanCid);
            if (dupRes.isDuplicate && dupRes.existingPatient) {
                isDuplicateBlocked = true;
                const ep = dupRes.existingPatient;
                const canOpen = OrsomoCore.Auth.canAccessPatient(authCtx, ep, 'village');
                const openLinkHtml = canOpen
                    ? `<div class="pt-1 flex gap-2">
                           <a href="patient_profile.html?id=${encodeURIComponent(ep.docId)}" class="px-3 py-1.5 bg-red-600 text-white rounded-lg font-bold text-[11px] inline-flex items-center gap-1 hover:bg-red-700">
                               <span class="material-symbols-outlined text-[14px]">visibility</span> เปิดแฟ้มประวัติเดิม
                           </a>
                       </div>`
                    : `<p class="text-[11px] text-red-700 font-medium">กรุณาติดต่อเจ้าหน้าที่ รพ.สต. หรือแอดมินส่วนกลางหากผู้ป่วยย้ายหมู่บ้านเข้ามาใหม่</p>`;

                statusDiv.className = 'p-3 bg-red-50 border border-red-200 rounded-xl text-xs mt-2 text-red-700 flex flex-col gap-1.5';
                statusDiv.innerHTML = `
                    <div class="font-bold flex items-center gap-1.5 text-red-800">
                        <span class="material-symbols-outlined text-[18px]">error</span> พบเลขบัตรประชาชนนี้ในระบบแล้ว! (ห้ามลงทะเบียนซ้ำ)
                    </div>
                    <div class="text-[11px] text-red-600">
                        ชื่อ: <b>${escapeHtml((ep.prefix || '') + (ep.name || '-'))}</b> • หมู่ที่ ${escapeHtml(ep.village_no)} บ้านเลขที่ ${escapeHtml(ep.house_no)} (สถานะ: ${escapeHtml(ep.status)})
                    </div>
                    ${openLinkHtml}
                `;
                statusDiv.classList.remove('hidden');
                return true;
            } else {
                isDuplicateBlocked = false;
                statusDiv.className = 'text-xs mt-1.5 flex items-center gap-1 text-emerald-600 font-bold';
                statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px]">check_circle</span> เลขบัตร 13 หลักถูกต้อง และยังไม่ซ้ำในระบบ`;
                statusDiv.classList.remove('hidden');
                return false;
            }
        } catch (err) {
            console.error('Check duplicate error:', err);
            statusDiv.classList.add('hidden');
            return false;
        }
    }

    document.getElementById('patient-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!authCtx || !db) return;

        const rawIdCard = document.getElementById('id_card').value;
        const idCheck = OrsomoCore.PatientValidator.validateThaiID(rawIdCard);
        if (!idCheck.valid) {
            showToast(idCheck.message, 'error');
            document.getElementById('id_card').focus();
            return;
        }

        const cleanId = idCheck.cleanId;
        const fullName = document.getElementById('fullname').value.trim();
        const houseNo = document.getElementById('house_no').value.trim();
        const villageNo = (authCtx.role === 'VHV' && authCtx.villageNo)
            ? authCtx.villageNo
            : document.getElementById('village_no').value.trim();

        if (!fullName || !houseNo || !villageNo) {
            showToast('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน', 'error');
            return;
        }

        const btn = document.getElementById('btn-save');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<div class="loader-small" style="border-bottom-color:#fff;"></div> กำลังตรวจสอบและบันทึก...`;
        btn.disabled = true;

        try {
            const dupRes = await OrsomoCore.PatientValidator.checkDuplicateIDCard(db, cleanId);
            if (dupRes.isDuplicate && dupRes.existingPatient) {
                const ep = dupRes.existingPatient;
                await verifyDuplicateCID(cleanId);
                showToast(`เลขบัตรซ้ำกับ ${(ep.prefix || '') + (ep.name || '')} (หมู่ ${ep.village_no})`, 'error');
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                return;
            }

            const dobInput = document.getElementById('dob').value;
            const dobThai = dobInput ? OrsomoCore.DateUtils.toThaiDate(dobInput) : '';
            const calcAge = dobInput ? String(OrsomoCore.DateUtils.calculateAge(dobInput, '')) : '';

            const targetDocId = cleanId;
            const patientData = {
                id: targetDocId,
                id_card: cleanId,
                prefix: document.getElementById('prefix').value,
                name: fullName,
                dob: dobThai,
                age: calcAge !== '-' ? calcAge : '',
                house_no: houseNo,
                village_no: String(villageNo),
                lat_long: document.getElementById('lat_long_value').value.trim(),
                caregiver_name: document.getElementById('caregiver_name').value.trim(),
                caregiver_phone: document.getElementById('caregiver_phone').value.trim(),
                status: 'Active',
                group: 'ยังไม่ประเมิน',
                adl: '-',
                dep_status: '-',
                last_assess: '-',
                last_adl_date: '',
                last_dep_date: '',
                last_vital_date: '',
                last_visit_date: '',
                disease: '-',
                medication: [],
                diaper: OrsomoCore.DiaperAdapter.normalizeForSave({}),
                equipment: '-',
                assigned_vhv_id: authCtx.role === 'VHV' ? authCtx.uid : '',
                needs_assessment: false,
                task_desc: '',
                tasks_required: [],
                created_by: OrsomoCore.UI.formatVHVName(authCtx.user),
                creator_uid: authCtx.uid,
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('Patients').doc(targetDocId).set(patientData);
            showToast('ลงทะเบียนผู้ป่วยใหม่เรียบร้อยแล้ว', 'success', `patient_profile.html?id=${encodeURIComponent(targetDocId)}`);
        } catch (error) {
            console.error(error);
            showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง', 'error');
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
