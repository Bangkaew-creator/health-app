<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>ลงทะเบียนผู้ป่วยใหม่ - อสม.สามารถ (Orsomo Smart)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="config.js"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent;}
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .loader-small { border: 2px solid #d8e3fb; border-bottom-color: #00694a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .input-field { width: 100%; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; font-size: 15px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .input-field:focus { border-color: #00694a; box-shadow: 0 0 0 3px rgba(0,105,74,0.1); }
    </style>
</head>
<body class="text-[#111c2d]">

<header class="bg-white sticky top-0 z-50 shadow-sm flex items-center w-full px-4 h-16 border-b border-gray-200 gap-3">
    <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-[#00694a] hover:bg-gray-100">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="text-base font-bold text-[#00694a]">ลงทะเบียนผู้ป่วยใหม่</h1>
</header>

<main class="max-w-2xl mx-auto p-4 pt-6 space-y-6">

    <form id="patient-form" class="space-y-6">
        
        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#00694a] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">person</span> ข้อมูลส่วนบุคคล
            </h3>
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]">เลขประจำตัวประชาชน (13 หลัก)</label>
                <input type="tel" id="id_card" maxlength="13" class="input-field" placeholder="ระบุเลขบัตรประชาชน">
                <div id="id_card_check_status" class="hidden text-xs mt-1 transition-all"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="space-y-1.5 col-span-1">
                    <label class="text-xs font-bold text-[#526069]">คำนำหน้า</label>
                    <select id="prefix" class="input-field bg-white">
                        <option value="นาย">นาย</option>
                        <option value="นาง">นาง</option>
                        <option value="นางสาว">นางสาว</option>
                    </select>
                </div>
                <div class="space-y-1.5 col-span-2">
                    <label class="text-xs font-bold text-[#526069]">ชื่อ - นามสกุล <span class="text-[#ba1a1a]">*</span></label>
                    <input type="text" id="fullname" required class="input-field" placeholder="เช่น สมชาย ใจดี">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]">วันเกิด</label>
                    <input type="date" id="dob" class="input-field bg-white">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]">อายุ (ปี)</label>
                    <input type="number" id="age" readonly class="input-field bg-gray-50 text-[#00694a] font-bold cursor-not-allowed" placeholder="คำนวณอัตโนมัติ">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#00694a] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">home</span> ที่อยู่ปัจจุบัน
            </h3>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]">บ้านเลขที่ <span class="text-[#ba1a1a]">*</span></label>
                    <input type="text" id="house_no" required class="input-field" placeholder="เช่น 45/1">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[#526069]">หมู่ที่ <span class="text-[#ba1a1a]">*</span></label>
                    <input type="number" id="village_no" required class="input-field" placeholder="เช่น 4">
                </div>
            </div>
            
            <div class="pt-2">
                <input type="hidden" id="lat_long_value" value="">
                <button type="button" id="btn-gps" class="w-full py-3.5 border-2 border-[#bdcac1] text-[#526069] rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-[#d8e3fb] transition-colors">
                    <span class="material-symbols-outlined text-[18px]">pin_drop</span> ปักหมุดพิกัด GPS บ้าน
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[22px] p-6 shadow-sm border border-gray-100 space-y-4">
            <h3 class="font-bold text-[#f59e0b] flex items-center gap-2 border-b pb-3 mb-2">
                <span class="material-symbols-outlined text-[20px]">group</span> ญาติ / ผู้ดูแลใกล้ชิด
            </h3>
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]">ชื่อ - นามสกุล ผู้ดูแล</label>
                <input type="text" id="caregiver_name" class="input-field" placeholder="ระบุชื่อผู้ติดต่อหลัก (ถ้ามี)">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[#526069]">เบอร์โทรศัพท์ติดต่อ</label>
                <input type="tel" id="caregiver_phone" class="input-field" placeholder="เช่น 0812345678">
            </div>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t p-4 z-50">
            <button type="submit" id="btn-save" class="w-full max-w-2xl mx-auto bg-[#00694a] text-white py-4 rounded-xl font-bold shadow-md hover:bg-[#005239] active:scale-95 transition-all flex items-center justify-center gap-2 text-base">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                บันทึกข้อมูลและลงทะเบียนผู้ป่วย
            </button>
        </div>
    </form>
</main>

<script>
    firebase.initializeApp(firebaseConfig);
    firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Offline persistence error:', err.code));
        const db = firebase.firestore();
    
    let currentUserRole = 'VHV';
    let currentUserName = 'อสม.'; // ตัวแปรเก็บชื่อสำหรับบันทึก
    let currentUserUid = '';     // ตัวแปรเก็บ UID

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID }).then(() => {
            const mockUid = localStorage.getItem('dev_mock_uid');
            const savedUid = localStorage.getItem('orsomo_uid');
            if (mockUid) {
                checkUserRole(mockUid);
            } else if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    localStorage.setItem('orsomo_uid', profile.userId);
                    checkUserRole(profile.userId);
                }).catch(err => console.error(err));
            } else if (savedUid) {
                checkUserRole(savedUid);
            } else { 
                window.location.href = 'index.html'; 
            }
        }).catch(() => { window.location.href = 'index.html'; });
    });

    async function checkUserRole(uid) {
        currentUserUid = uid;
        try {
            const userDoc = await db.collection('VHVs').doc(String(uid)).get();
            if (userDoc.exists) {
                currentUserRole = String(userDoc.data().role || 'VHV').toUpperCase();
                currentUserName = userDoc.data().name || 'อสม.';
            }
        } catch(e) { console.error(e); }
    }

    function goBack() {
        if (currentUserRole === 'ADMIN' || currentUserRole === 'SUB_ADMIN') {
            window.location.href = 'admin_datacenter.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    }

    document.getElementById('dob').addEventListener('change', function() {
        if(this.value) {
            const parts = this.value.split('-');
            let inputYear = parseInt(parts[0]);
            if (inputYear > 2400) inputYear -= 543;

            const birthDate = new Date(inputYear, parseInt(parts[1]) - 1, parseInt(parts[2]));
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            document.getElementById('age').value = age >= 0 ? age : 0;
        }
    });

    document.getElementById('btn-gps').addEventListener('click', function() {
        const btn = this;
        btn.innerHTML = `<div class="loader-small border-b-[#526069]"></div> กำลังค้นหาตำแหน่ง...`;
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('lat_long_value').value = `${lat}, ${lon}`;
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> พิกัด: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    btn.className = "w-full py-3.5 border-2 border-[#00694a] text-[#00694a] bg-[#f0fdf4] rounded-xl text-xs font-bold flex items-center justify-center gap-2";
                }, 
                function(error) {
                    btn.innerHTML = `<span class="material-symbols-outlined">error</span> ไม่สามารถดึงตำแหน่งได้ โปรดเปิด GPS`;
                    btn.className = "w-full py-3.5 border-2 border-[#dc2626] text-[#dc2626] rounded-xl text-xs font-bold flex items-center justify-center gap-2";
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        } else {
            alert('เบราว์เซอร์ของคุณไม่รองรับการดึงตำแหน่ง GPS');
        }
    });

    let checkTimeout = null;
    document.getElementById('id_card').addEventListener('input', function() {
        const val = this.value.trim().replace(/[^0-9]/g, '');
        this.value = val;
        clearTimeout(checkTimeout);
        const statusDiv = document.getElementById('id_card_check_status');
        if (val.length === 13) {
            statusDiv.className = "text-xs mt-1.5 flex items-center gap-1.5 text-blue-600 font-medium";
            statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> กำลังตรวจสอบข้อมูลซ้ำ...`;
            statusDiv.classList.remove('hidden');
            checkTimeout = setTimeout(() => checkDuplicateCID(val), 350);
        } else {
            statusDiv.classList.add('hidden');
            statusDiv.innerHTML = '';
        }
    });

    async function checkDuplicateCID(cid) {
        const statusDiv = document.getElementById('id_card_check_status');
        try {
            const snap = await db.collection('Patients').where('id_card', '==', cid).get();
            if (!snap.empty) {
                const p = snap.docs[0].data();
                const docId = snap.docs[0].id;
                statusDiv.className = "p-3 bg-red-50 border border-red-200 rounded-xl text-xs mt-2 text-red-700 flex flex-col gap-1.5";
                statusDiv.innerHTML = `
                    <div class="font-bold flex items-center gap-1.5 text-red-800">
                        <span class="material-symbols-outlined text-[18px]">error</span> พบเลขบัตรประชาชนนี้ในระบบแล้ว!
                    </div>
                    <div class="text-[11px] text-red-600">
                        ชื่อ: <b>${p.prefix || ''}${p.name || '-'}</b> (หมู่ที่ ${p.village_no || '-'} บ้านเลขที่ ${p.house_no || '-'})
                    </div>
                    <div class="pt-1 flex gap-2">
                        <a href="patient_profile.html?id=${docId}" target="_blank" class="px-3 py-1 bg-red-600 text-white rounded-lg font-bold text-[11px] inline-flex items-center gap-1 hover:bg-red-700">
                            <span class="material-symbols-outlined text-[14px]">visibility</span> ดูแฟ้มประวัติ
                        </a>
                    </div>
                `;
                statusDiv.classList.remove('hidden');
                return true;
            } else {
                statusDiv.className = "text-xs mt-1.5 flex items-center gap-1 text-emerald-600 font-bold";
                statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px]">check_circle</span> เลขบัตรนี้ยังไม่มีในระบบ (สามารถลงทะเบียนได้)`;
                statusDiv.classList.remove('hidden');
                return false;
            }
        } catch(err) {
            console.error("Check duplicate error:", err);
            statusDiv.classList.add('hidden');
            return false;
        }
    }

    document.getElementById('patient-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        btn.innerHTML = `<div class="loader-small" style="border-bottom-color:#fff;"></div> กำลังบันทึกข้อมูล...`;
        btn.disabled = true;

        const idCard = document.getElementById('id_card').value.trim().replace(/[^0-9]/g, '');

        if (idCard.length === 13) {
            try {
                const dupSnap = await db.collection('Patients').where('id_card', '==', idCard).get();
                if (!dupSnap.empty) {
                    const dupP = dupSnap.docs[0].data();
                    alert(`⚠️ ไม่สามารถลงทะเบียนได้!\n\nเนื่องจากเลขบัตรประชาชน ${idCard} มีบันทึกอยู่ในระบบแล้ว:\n"${dupP.prefix || ''}${dupP.name || ''}" (หมู่ที่ ${dupP.village_no || '-'} บ้านเลขที่ ${dupP.house_no || '-'})\n\nกรุณาตรวจสอบหรือเปิดแฟ้มประวัติเพื่ออัปเดตข้อมูล`);
                    btn.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span> บันทึกข้อมูลและลงทะเบียนผู้ป่วย`;
                    btn.disabled = false;
                    return;
                }
            } catch(e) {
                console.warn("Pre-check error:", e);
            }
        }

        const docRef = db.collection('Patients').doc();
        const targetDocId = (idCard.length === 13) ? idCard : docRef.id;
        
        const patientData = {
            id: targetDocId,
            id_card: idCard,
            prefix: document.getElementById('prefix').value,
            name: document.getElementById('fullname').value.trim(), 
            dob: document.getElementById('dob').value,
            age: document.getElementById('age').value,
            house_no: document.getElementById('house_no').value.trim(),
            village_no: document.getElementById('village_no').value.trim(),
            lat_long: document.getElementById('lat_long_value').value,
            caregiver_name: document.getElementById('caregiver_name').value.trim(),
            caregiver_phone: document.getElementById('caregiver_phone').value.trim(),
            status: 'Active',
            group: 'ยังไม่ประเมิน',
            last_assess: '-',
            dep_status: '-',
            disease: '-',
            medication: '-',
            diaper: '',
            equipment: '-',
            created_by: currentUserName,    // 🌟 แสตมป์ชื่อคนเพิ่ม
            creator_uid: currentUserUid,    // 🌟 แสตมป์ UID คนเพิ่ม
            created_at: firebase.firestore.FieldValue.serverTimestamp() // 🌟 แสตมป์เวลา
        };

        try {
            await db.collection('Patients').doc(targetDocId).set(patientData);
            
            alert(`ลงทะเบียนผู้ป่วยใหม่เรียบร้อยแล้ว!\n(หากใช้งานออฟไลน์ ข้อมูลจะถูกอัปเดตอัตโนมัติเมื่อมีสัญญาณเน็ต)`);
            goBack(); 

        } catch (error) {
            console.error(error);
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            btn.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span> บันทึกข้อมูลและลงทะเบียนผู้ป่วย`;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
